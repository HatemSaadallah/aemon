<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Judge Qualification</title><style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:0 1rem;background:#f7f7f4;color:#182c2b}article{background:white;border:1px solid #ddd;padding:1rem;margin:1rem 0}pre{white-space:pre-wrap;font-size:.85rem}</style><h1>Judge Qualification</h1><p id="status">Loading…</p><p>These anchors are synthetic development controls. No model is qualified until its saved predictions pass the separate reliability check.</p><section id="packets"></section><script>fetch('/api/status').then(r=>r.json()).then(x=>{document.querySelector('#status').textContent='Status: '+x.status+' · '+x.config.version;x.anchors.forEach(a=>{let e=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('pre');h.textContent=a.packet_id;p.textContent=JSON.stringify(a,null,2);e.append(h,p);document.querySelector('#packets').append(e)})}).catch(e=>document.querySelector('#status').textContent='Could not load status: '+e.message)</script>
