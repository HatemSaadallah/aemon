<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strategy Lab</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Strategy Lab</h1>
      <span class="tag">Development pilots, not a final test</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="tab-try" aria-controls="try" aria-selected="true">Try it</button>
      <button role="tab" id="tab-how" aria-controls="how" aria-selected="false" tabindex="-1">How it works</button>
      <button role="tab" id="tab-math" aria-controls="math" aria-selected="false" tabindex="-1">The math</button>
      <button role="tab" id="tab-results" aria-controls="results" aria-selected="false" tabindex="-1">Results</button>
      <button role="tab" id="tab-training" aria-controls="training" aria-selected="false" tabindex="-1">Training</button>
    </nav>
    <div class="account" id="account"><span id="account-name"></span><button type="button" id="sign-out">Sign out</button></div>
  </header>

  <main>
    <section id="try" role="tabpanel" aria-labelledby="tab-try" tabindex="0"></section>
    <section id="how" role="tabpanel" aria-labelledby="tab-how" tabindex="0" hidden></section>
    <section id="math" role="tabpanel" aria-labelledby="tab-math" tabindex="0" hidden></section>
    <section id="results" role="tabpanel" aria-labelledby="tab-results" tabindex="0" hidden></section>
    <section id="training" role="tabpanel" aria-labelledby="tab-training" tabindex="0" hidden></section>
  </main>

  <div id="error" role="alert" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
